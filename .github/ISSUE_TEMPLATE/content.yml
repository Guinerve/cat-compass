name: Source or safety correction
description: Correct a health claim, source link or local rule.
title: "[Content]: "
labels: [content]
body:
  - type: markdown
    attributes: { value: "This channel is not an emergency service. Contact a vet for an ill cat. Do not include private records." }
  - type: textarea
    id: claim
    attributes: { label: Exact claim and location, description: "Name the screen, guide or source ID." }
    validations: { required: true }
  - type: input
    id: source
    attributes: { label: Direct source URL, description: "Prefer an authoritative primary page or guideline. Search snippets are not enough." }
    validations: { required: true }
  - type: textarea
    id: evidence
    attributes: { label: Read section and limits, description: "Give the title, publisher, version/date, page or section, and what it does or does not support." }
    validations: { required: true }
  - type: textarea
    id: correction
    attributes: { label: Proposed correction }
    validations: { required: true }
